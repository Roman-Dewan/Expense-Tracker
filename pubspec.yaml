name: expense_tracker
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  intl: ^0.20.2
  uuid: ^4.5.3
  sqflite: ^2.4.4+2
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.12.0
  printing: ^5.14.3
  excel: ^4.0.6
  csv: ^8.0.0
  file_picker: ^13.1.0
  share_plus: ^13.3.1
  fl_chart: ^1.2.0
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4


flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/play_store_512.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/icon/play_store_512.png"
  adaptive_icon_foreground: "assets/icon/play_store_512.png"